[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-uplift"
version = "0.1.0"
description = "Causal uplift modeling for music promotional campaign impact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0; python_version < '3.14'",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "typer>=0.9",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
ranking = [
    "apache-beam>=2.50",
    "xgboost>=2.0",
    "lightgbm>=4.0; python_version < '3.14'",
    "duckdb>=0.9",
    "shap>=0.43",
    "seaborn>=0.12",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[project.scripts]
music-uplift = "music_uplift.cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["music_uplift*", "music_uplift_ranking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
